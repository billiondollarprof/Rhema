<!--
  sign-in-code.html: the email that carries the 6 digit sign-in code.

  Why: request 109 and the 6 November list, item 11. The app signs in with an
  email code, but Supabase's own wording only has a link. This wording shows
  the code. Pasted by hand into Supabase, Authentication, Email Templates,
  into BOTH "Magic link" and "Confirm signup", on testing and on live.
  Subject for both: Your Rhema sign-in code

  Colours as in the app: navy #0a2a5e, blue #1f5fd0, a thin red line #d9232d.
  No picture, because many email apps hide pictures and the web address is
  about to change. {{ .Token }} is the code, filled in by Supabase. The code
  works for 600 seconds (10 minutes), as set in Supabase.

  Never: put a link in this email, or any patient detail.
-->
<div style="background: #f2f5fa; padding: 24px 12px; font-family: Arial, Helvetica, sans-serif">
  <table
    role="presentation"
    width="100%"
    cellpadding="0"
    cellspacing="0"
    style="max-width: 480px; margin: 0 auto; background: #ffffff; border-radius: 12px"
  >
    <tr>
      <td
        style="
          background: #0a2a5e;
          padding: 20px 24px;
          color: #ffffff;
          font-size: 18px;
          font-weight: bold;
          border-radius: 12px 12px 0 0;
        "
      >
        Rhema Medical Centre
      </td>
    </tr>
    <tr>
      <td style="height: 3px; background: #d9232d; font-size: 0; line-height: 0">&nbsp;</td>
    </tr>
    <tr>
      <td style="padding: 28px 24px 8px; color: #0f2238; font-size: 16px; line-height: 24px">
        Use this code to sign in:
      </td>
    </tr>
    <tr>
      <td style="padding: 8px 24px 16px" align="center">
        <div
          style="
            display: inline-block;
            border: 2px solid #1f5fd0;
            border-radius: 10px;
            padding: 14px 26px;
            font-size: 32px;
            letter-spacing: 8px;
            font-weight: bold;
            color: #0a2a5e;
          "
        >
          {{ .Token }}
        </div>
      </td>
    </tr>
    <tr>
      <td style="padding: 0 24px 28px; color: #5b6b80; font-size: 14px; line-height: 22px">
        The code works for 10 minutes. If you did not ask for it, you can ignore this email.
      </td>
    </tr>
  </table>
</div>

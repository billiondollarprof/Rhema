# db-live.yml: applies database changes to the LIVE hospital project.
#
# When a change to supabase/migrations lands on main, this applies it to the
# live database (ntfvckqczpmylskusgft), then runs Supabase's security check.
#
# Anthony's rule, 2026-10-28: once a change passes on testing, it goes live.
# So this workflow refuses to run any migration that the TESTING database
# does not already have. Nothing reaches live that was not tested first.
#
# It must never: skip that guard, or apply anything when the guard fails.
name: Database (live)

on:
  push:
    branches: [main]
    paths:
      - supabase/migrations/**
      - .github/workflows/db-live.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-live
  cancel-in-progress: false

env:
  LIVE_REF: ntfvckqczpmylskusgft
  TESTING_REF: nfrvwvqmfxudaarfuwxg

jobs:
  migrate:
    # Only from main, even when started by hand.
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      LIVE_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      TESTING_PASSWORD: ${{ secrets.SUPABASE_TESTING }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - name: Make sure psql is installed
        run: command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)

      # ===== 1. Build both database addresses =====
      # Same method as db-testing.yml: ask Supabase for the pooler address,
      # then connect with the password. The passwords are masked in the log.
      # The function writes straight to GITHUB_ENV. It must not be called
      # inside $( ), because then the mask line would end up inside the
      # address (that broke the first run, 2026-10-28, before anything ran).
      - name: Build the database addresses
        run: |
          address() {
            pooler=$(curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/$2/config/database/pooler")
            host=$(echo "$pooler" | jq -r '.[0].db_host')
            user=$(echo "$pooler" | jq -r '.[0].db_user')
            pass=$(P="$3" python3 -c 'import os,urllib.parse;print(urllib.parse.quote(os.environ["P"],safe=""))')
            echo "::add-mask::$pass"
            echo "$1=postgresql://$user:$pass@$host:5432/postgres" >> "$GITHUB_ENV"
          }
          address LIVE_URL "$LIVE_REF" "$LIVE_PASSWORD"
          address TESTING_URL "$TESTING_REF" "$TESTING_PASSWORD"

      # ===== 2. The guard: testing must already have every migration =====
      - name: Refuse anything the testing database has not taken
        run: |
          tested=$(psql "$TESTING_URL" -At -c "select version from supabase_migrations.schema_migrations")
          missing=0
          for file in supabase/migrations/*.sql; do
            version=$(basename "$file" | cut -d_ -f1)
            if ! echo "$tested" | grep -qx "$version"; then
              echo "NOT on testing yet: $file"
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then
            echo "Stopped. Every migration must pass on testing before it goes live."
            exit 1
          fi
          echo "Every migration is already on the testing database."

      # ===== 3. Apply to live =====
      - name: Show what will be applied
        run: supabase db push --db-url "$LIVE_URL" --dry-run

      - name: Apply it
        run: supabase db push --db-url "$LIVE_URL"

      # ===== 4. Check the live project after the change =====
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Security check on the live project
        env:
          SUPABASE_PROJECT_REF: ${{ env.LIVE_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: python ops/supabase_check.py

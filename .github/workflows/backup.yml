# backup.yml: the nightly backup of the LIVE hospital database (request 94,
# Anthony's choice 2026-10-30: a second Cloudflare account, not Google Drive).
#
# Every 2 hours (Anthony, 2026-11-16, request 206: "the backup is taking in
# everything automatically... if the live site ever crashes... they can
# access their data"), so at most about 2 hours of work can be lost. The run
# at 02:17 Nigeria time is the NIGHT run; the others are the 2-hourly runs.
#
# What it does, in order:
#   1. Copies the live database: the hospital's own tables (schemas public
#      and private, with their rules) and the sign in accounts (auth.users,
#      auth.identities), which the staff rows point at.
#   2. Locks the copy with Anthony's passphrase (BACKUP_PASSPHRASE, AES-256)
#      before it leaves GitHub's computer. Cloudflare only ever holds a
#      scrambled file.
#   3. Uploads it to the rhema-backup bucket in the separate backup account.
#   4. Checks it: downloads it again, compares the fingerprint, unlocks it,
#      lists what is inside, and checks the main tables hold at least the
#      rows counted just before the copy (2026-11-16, request 218), so a
#      broken backup fails loudly here instead of being found broken on the
#      day it is needed.
#   5. Keeps the 2-hourly copies (recent/) for 2 days, every night's copy
#      (daily/) for 35 days, and the first of each month (monthly/) for good.
#   6. Copies the uploaded files (rhema-files, in the main Cloudflare
#      account): lab result files (lab/) and, since 2026-11-16, the patient
#      record files and old file scans (record/), which were missing from
#      the backup until then. Into files/, each one locked with the same
#      passphrase. Files never change once saved (each has a random name),
#      so only files not copied before are copied, and none is ever removed
#      from the backup. The main account key can only READ rhema-files
#      (request 119).
#
# A failed run is an outage (CLAUDE.md section 10): GitHub emails the repo
# owner, and the run shows red.
#
# It must never: print a password, the passphrase or any patient detail;
# upload an unlocked copy; touch the testing database; or delete a monthly
# copy.
name: Nightly backup
on:
  schedule:
    # Every 2 hours, at 17 minutes past: 01:17 UTC (02:17 in Lagos, when the
    # hospital is quietest) is the night run, then 03:17, 05:17 and so on.
    - cron: '17 1-23/2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

env:
  LIVE_REF: ntfvckqczpmylskusgft
  BUCKET: rhema-backup

jobs:
  backup:
    if: github.ref_name == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      LIVE_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      R2_ACCOUNT: ${{ secrets.BACKUP_R2_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      # The main account (where the live lab files are), read only.
      FILES_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FILES_KEY_ID: ${{ secrets.FILES_R2_ACCESS_KEY_ID }}
      FILES_SECRET: ${{ secrets.FILES_R2_SECRET_ACCESS_KEY }}
    steps:
      # ===== 0. Stop at once if a key is missing =====
      - name: Check every key is set
        run: |
          missing=""
          for name in SUPABASE_ACCESS_TOKEN LIVE_PASSWORD PASSPHRASE R2_ACCOUNT AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY FILES_ACCOUNT FILES_KEY_ID FILES_SECRET; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then echo "Missing secrets:$missing"; exit 1; fi
          echo "R2=https://$R2_ACCOUNT.r2.cloudflarestorage.com" >> "$GITHUB_ENV"
          echo "FILES_R2=https://$FILES_ACCOUNT.r2.cloudflarestorage.com" >> "$GITHUB_ENV"

      # ===== 1. The live database address (same method as db-live.yml) =====
      - name: Build the database address
        run: |
          pooler=$(curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$LIVE_REF/config/database/pooler")
          host=$(echo "$pooler" | jq -r '.[0].db_host')
          user=$(echo "$pooler" | jq -r '.[0].db_user')
          pass=$(P="$LIVE_PASSWORD" python3 -c 'import os,urllib.parse;print(urllib.parse.quote(os.environ["P"],safe=""))')
          echo "::add-mask::$pass"
          echo "LIVE_URL=postgresql://$user:$pass@$host:5432/postgres" >> "$GITHUB_ENV"

      # ===== 2. Copy the database =====
      # pg_dump from the official Postgres 17 image, the same version as the
      # database, so the copy is exact. Two files, then one bundle.
      - name: Copy the live database
        run: |
          mkdir -p copy
          stamp=$(date -u +%Y-%m-%d)
          echo "STAMP=$stamp" >> "$GITHUB_ENV"
          # The hour, for the 2-hourly copy's name, and whether this is the
          # night run (01 UTC, or a run started by hand).
          echo "HOUR=$(date -u +%H)" >> "$GITHUB_ENV"
          if [ "$(date -u +%H)" = "01" ] || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "NIGHT=true" >> "$GITHUB_ENV"
          else
            echo "NIGHT=false" >> "$GITHUB_ENV"
          fi
          # The rows in the main tables, counted just before the copy, so step
          # 5 can prove the copy holds at least as many (2026-11-16, request
          # 218: "nothing goes away, nothing misses, nothing is lost").
          docker run --rm --network host -e URL="$LIVE_URL" postgres:17 \
            sh -c 'for t in patients staff medical_profiles consultation_notes nursing_notes vital_signs medications_given patient_medications lab_requests lab_results prescriptions payments patient_files activity_log; do
                     printf "%s %s\n" "$t" "$(psql "$URL" -tA -c "select count(*) from public.$t")"; done' > counts.txt
          docker run --rm --network host -e URL="$LIVE_URL" -v "$PWD/copy:/copy" postgres:17 \
            sh -c 'pg_dump "$URL" --format=custom --schema=public --schema=private --file=/copy/hospital.dump &&
                   pg_dump "$URL" --format=custom --data-only --table=auth.users --table=auth.identities --file=/copy/accounts.dump'
          tar -czf "rhema-$stamp.tar.gz" -C copy hospital.dump accounts.dump
          rm -rf copy
          echo "Copy made: $(du -h "rhema-$stamp.tar.gz" | cut -f1)"

      # ===== 3. Lock it with the passphrase =====
      # The passphrase goes in through a pipe, never on the command line.
      - name: Lock the copy
        run: |
          printf '%s' "$PASSPHRASE" | gpg --batch --yes --quiet --pinentry-mode loopback \
            --passphrase-fd 0 --symmetric --cipher-algo AES256 \
            --output "rhema-$STAMP.tar.gz.gpg" "rhema-$STAMP.tar.gz"
          rm -f "rhema-$STAMP.tar.gz"
          sha256sum "rhema-$STAMP.tar.gz.gpg" | cut -d' ' -f1 > fingerprint.txt

      # ===== 4. Upload to the backup account =====
      - name: Upload to the backup account
        run: |
          # Every run: the 2-hourly copy, named by day and hour.
          aws s3 cp "rhema-$STAMP.tar.gz.gpg" "s3://$BUCKET/recent/rhema-$STAMP-$HOUR.tar.gz.gpg" \
            --endpoint-url "$R2" --only-show-errors
          echo "CHECK_KEY=recent/rhema-$STAMP-$HOUR.tar.gz.gpg" >> "$GITHUB_ENV"
          if [ "$NIGHT" != "true" ]; then exit 0; fi
          # The night run: also the nightly copy, kept 35 days.
          aws s3 cp "rhema-$STAMP.tar.gz.gpg" "s3://$BUCKET/daily/rhema-$STAMP.tar.gz.gpg" \
            --endpoint-url "$R2" --only-show-errors
          # The first of the month is also kept for good.
          if [ "$(date -u +%d)" = "01" ]; then
            aws s3 cp "rhema-$STAMP.tar.gz.gpg" "s3://$BUCKET/monthly/rhema-$STAMP.tar.gz.gpg" \
              --endpoint-url "$R2" --only-show-errors
          fi

      # ===== 5. Check it: download, compare, unlock, list =====
      - name: Check the backup can be opened
        run: |
          aws s3 cp "s3://$BUCKET/$CHECK_KEY" check.gpg --endpoint-url "$R2" --only-show-errors
          if [ "$(sha256sum check.gpg | cut -d' ' -f1)" != "$(cat fingerprint.txt)" ]; then
            echo "FAILED: the stored backup is not the one that was sent"; exit 1
          fi
          printf '%s' "$PASSPHRASE" | gpg --batch --quiet --pinentry-mode loopback \
            --passphrase-fd 0 --decrypt --output check.tar.gz check.gpg
          mkdir check && tar -xzf check.tar.gz -C check
          docker run --rm -v "$PWD/check:/check" postgres:17 \
            sh -c 'pg_restore --list /check/hospital.dump > /check/hospital.list && pg_restore --list /check/accounts.dump > /check/accounts.list'
          # The tables the hospital cannot lose must be in the copy.
          for table in patients staff medical_profiles lab_results payments activity_log; do
            grep -q "TABLE DATA public $table " check/hospital.list || { echo "FAILED: $table is missing"; exit 1; }
          done
          grep -q "TABLE DATA auth users " check/accounts.list || { echo "FAILED: sign in accounts are missing"; exit 1; }
          # Every row counted before the copy is in it (new rows may be extra).
          cp counts.txt check/counts.txt
          docker run --rm -v "$PWD/check:/check" postgres:17 \
            sh -c 'while read -r t before; do
                     inside=$(pg_restore --data-only --schema=public --table="$t" -f - /check/hospital.dump | sed -n "/^COPY /,/^\\\\.\$/p" | wc -l)
                     inside=$((inside - 2)); if [ "$inside" -lt 0 ]; then inside=0; fi
                     if [ "$inside" -lt "$before" ]; then echo "FAILED: $t had $before rows, the copy holds $inside"; exit 1; fi
                     echo "$t: $before rows before, $inside in the copy"
                   done < /check/counts.txt'
          echo "Backup checked: stored, unchanged, opens with the passphrase, all key tables present."
          rm -rf check check.gpg check.tar.gz

      # ===== 6. Keep 2 days of 2-hourly copies, 35 days of nightly copies =====
      - name: Remove 2-hourly copies older than 2 days
        run: |
          cutoff=$(date -u -d '2 days ago' +%Y-%m-%d-%H)
          aws s3 ls "s3://$BUCKET/recent/" --endpoint-url "$R2" | awk '{print $4}' | while read -r name; do
            when=$(echo "$name" | sed -n 's/^rhema-\([0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}-[0-9]\{2\}\)\.tar\.gz\.gpg$/\1/p')
            if [ -n "$when" ] && [ "$when" \< "$cutoff" ]; then
              aws s3 rm "s3://$BUCKET/recent/$name" --endpoint-url "$R2" --only-show-errors
              echo "Removed an old 2-hourly copy from $when"
            fi
          done

      - name: Remove nightly copies older than 35 days
        if: env.NIGHT == 'true'
        run: |
          cutoff=$(date -u -d '35 days ago' +%Y-%m-%d)
          aws s3 ls "s3://$BUCKET/daily/" --endpoint-url "$R2" | awk '{print $4}' | while read -r name; do
            day=$(echo "$name" | sed -n 's/^rhema-\([0-9-]*\)\.tar\.gz\.gpg$/\1/p')
            if [ -n "$day" ] && [ "$day" \< "$cutoff" ]; then
              aws s3 rm "s3://$BUCKET/daily/$name" --endpoint-url "$R2" --only-show-errors
              echo "Removed an old nightly copy from $day"
            fi
          done

      # ===== 6b. Messages older than a year are deleted =====
      # Anthony, 2026-11-02: messages and announcements are kept 1 year.
      # Runs only after the backup above is saved and checked, so tonight's
      # copy still holds them for its 35 days.
      - name: Delete messages older than a year
        if: env.NIGHT == 'true'
        run: |
          # The command is in single quotes so that $URL is read inside the
          # container, where it is set, as in the backup step above.
          gone=$(docker run --rm --network host -e URL="$LIVE_URL" postgres:17 \
            sh -c 'psql "$URL" -tA -c "select private.forget_old_messages()"')
          echo "Messages and announcements older than a year deleted: $gone"

      # ===== 6c. The end of the day: visits still open are ended =====
      # Anthony, 2026-11-04 (requests 140 and 147): a patient sent to a room
      # yesterday and never finished should not still show in that room.
      # Each one is ended with the reason "end_of_day", never deleted.
      - name: End yesterday's open visits
        if: env.NIGHT == 'true'
        run: |
          ended=$(docker run --rm --network host -e URL="$LIVE_URL" postgres:17 \
            sh -c 'psql "$URL" -tA -c "select private.close_old_visits()"')
          echo "Visits still open from before today, now ended: $ended"

      # ===== 6d. Lab prices waiting 72 hours become standard =====
      # Anthony, 2026-11-16 (request 208): a price the Laboratory proposed
      # that the admin did not answer within 72 hours becomes standard. Runs
      # every 2 hours, after the copy is saved and checked.
      - name: Make lab prices standard after 72 hours
        run: |
          applied=$(docker run --rm --network host -e URL="$LIVE_URL" postgres:17 \
            sh -c 'psql "$URL" -tA -c "select private.apply_due_prices()"')
          echo "Lab prices made standard after 72 hours: $applied"

      # ===== 7. The uploaded files: copy the new ones, each locked =====
      # lab/: lab result files. record/: patient record files and old file
      # scans (added 2026-11-16; before that they were not backed up).
      - name: Copy new uploaded files
        run: |
          mkdir -p files
          for kind in lab record; do
            # Each list is read on its own line (not in a pipe), so a wrong key
            # stops the run here instead of quietly looking like "0 files".
            # What the backup already holds (names without the .gpg ending).
            aws s3api list-objects-v2 --bucket "$BUCKET" --prefix "files/$kind/" --endpoint-url "$R2" \
              --query 'Contents[].Key' --output text > have.raw
            tr '\t' '\n' < have.raw | grep -v '^None$' | sed "s#^files/$kind/##; s/\.gpg$//" | sort > have.txt || true
            # What the live bucket holds, read with the main account's read only key.
            AWS_ACCESS_KEY_ID="$FILES_KEY_ID" AWS_SECRET_ACCESS_KEY="$FILES_SECRET" \
              aws s3api list-objects-v2 --bucket rhema-files --prefix "$kind/" --endpoint-url "$FILES_R2" \
              --query 'Contents[].Key' --output text > live.raw
            tr '\t' '\n' < live.raw | grep -v '^None$' | sed "s#^$kind/##" | sort > live.txt || true
            copied=0
            for name in $(comm -13 have.txt live.txt); do
              # Our own names only (a random id and webp, jpg or pdf).
              echo "$name" | grep -Eq '^[0-9a-f-]{36}\.(webp|jpg|pdf)$' || continue
              AWS_ACCESS_KEY_ID="$FILES_KEY_ID" AWS_SECRET_ACCESS_KEY="$FILES_SECRET" \
                aws s3 cp "s3://rhema-files/$kind/$name" "files/$name" --endpoint-url "$FILES_R2" --only-show-errors
              printf '%s' "$PASSPHRASE" | gpg --batch --yes --quiet --pinentry-mode loopback \
                --passphrase-fd 0 --symmetric --cipher-algo AES256 --output "files/$name.gpg" "files/$name"
              aws s3 cp "files/$name.gpg" "s3://$BUCKET/files/$kind/$name.gpg" --endpoint-url "$R2" --only-show-errors
              rm -f "files/$name" "files/$name.gpg"
              copied=$((copied + 1))
            done
            echo "$kind files: $(wc -l < live.txt) live, $copied newly copied, all locked."
            # Every live file must now be in the backup. A file with a name we
            # do not expect would have been skipped above, so it fails here too.
            aws s3api list-objects-v2 --bucket "$BUCKET" --prefix "files/$kind/" --endpoint-url "$R2" \
              --query 'Contents[].Key' --output text > have.raw
            tr '\t' '\n' < have.raw | grep -v '^None$' | sed "s#^files/$kind/##; s/\.gpg$//" | sort > have.txt || true
            missing=$(comm -13 have.txt live.txt | wc -l)
            if [ "$missing" -gt 0 ]; then echo "FAILED: $missing $kind file(s) are not in the backup"; exit 1; fi
            echo "$kind files: every live file is in the backup."
          done
          rm -rf files have.txt live.txt have.raw live.raw

      # ===== 8. Nothing left behind on GitHub's computer =====
      - name: Clean up
        if: always()
        run: rm -rf copy check files ./*.gpg ./*.tar.gz fingerprint.txt counts.txt have.txt live.txt have.raw live.raw

# db-testing.yml: applies database changes to the TESTING project.
#
# When a change to supabase/migrations lands on the testing branch, this
# applies it to rhema-testing (made up patients only), then runs Supabase's
# security check against it. CI has already proved the same change on a
# throwaway database before it got here.
#
# It never touches the live project. The live database gets changes only
# from main, and only after Anthony has seen the SQL and said yes.
name: Database (testing)

on:
  push:
    branches: [testing]
    paths:
      - supabase/migrations/**
      - .github/workflows/db-testing.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-testing
  cancel-in-progress: false

env:
  TESTING_REF: nfrvwvqmfxudaarfuwxg

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_TESTING }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      # No "supabase link": it asks for more than our narrow key may do.
      # Instead, ask Supabase only for the pooler address (allowed), then
      # connect straight to the database with its password.
      - name: Build the database address
        run: |
          pooler=$(curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$TESTING_REF/config/database/pooler")
          host=$(echo "$pooler" | jq -r '.[0].db_host')
          user=$(echo "$pooler" | jq -r '.[0].db_user')
          pass=$(python3 -c 'import os,urllib.parse;print(urllib.parse.quote(os.environ["SUPABASE_DB_PASSWORD"],safe=""))')
          echo "::add-mask::$pass"
          echo "DB_URL=postgresql://$user:$pass@$host:5432/postgres" >> "$GITHUB_ENV"

      - name: Show what will be applied
        run: supabase db push --db-url "$DB_URL" --dry-run

      - name: Apply it
        run: supabase db push --db-url "$DB_URL"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Security check on the testing project
        env:
          SUPABASE_PROJECT_REF: ${{ env.TESTING_REF }}
        run: python ops/supabase_check.py

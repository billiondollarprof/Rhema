# keep-awake.yml: knocks on both hospital databases once a day.
#
# Why: Supabase's free plan pauses a project that gets too few user
# requests in 7 days ("a few user requests to the database each day" keeps
# it awake, per Supabase's docs). The live project gets real use once the
# hospital is on it; the testing project can go quiet. A paused project
# stops the app until somebody presses Resume, so this asks each database
# a tiny question every day, the way the app would.
#
# What it asks: the list of rooms, with the public key and nobody signed in.
# The database refuses (people who are not signed in may read nothing), and
# that refusal is the proof it was reached: the answer carries Postgres's
# own "permission denied" code, 42501. No data leaves the database.
#
# Note: GitHub's 60 day switch-off for timed workflows applies to public
# repos only. This repo is private, so this keeps running. It still lives
# in Anthony's GitHub, so before handover a Cloudflare timer (in the
# hospital's own account) does the same knock, and this one can stay as a
# second line.
#
# Never: use the secret key here, or read anything with patient data.
name: Keep databases awake

on:
  schedule:
    # Every day at 06:37 UTC (07:37 in Nigeria).
    - cron: '37 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  knock:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: live
            ref: ntfvckqczpmylskusgft
          - name: testing
            ref: nfrvwvqmfxudaarfuwxg
    name: knock (${{ matrix.name }})
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: ${{ matrix.ref }}
    steps:
      - name: Ask the database a small question three times
        run: |
          keys=$(curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$REF/api-keys?reveal=false")
          key=$(echo "$keys" | jq -r '[.[] | select(.type == "publishable")][0].api_key // empty')
          test -n "$key" || key=$(echo "$keys" | jq -r '[.[] | select(.name == "anon")][0].api_key // empty')
          test -n "$key" || { echo "No public key found"; exit 1; }
          for i in 1 2 3; do
            answer=$(curl -sS -H "apikey: $key" \
              "https://$REF.supabase.co/rest/v1/rooms?select=id&limit=1")
            echo "Knock $i: $(echo "$answer" | jq -r '.code // "rows"')"
            # 42501 is the database itself saying no. Anything else (an
            # outage page, a paused project) fails the job, so it is noticed.
            echo "$answer" | jq -e '.code == "42501"' > /dev/null || exit 1
            sleep 5
          done

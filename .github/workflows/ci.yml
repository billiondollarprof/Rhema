# ci.yml: the checks that run on every pull request and every push.
# It runs `npm run verify`, the same command an agent runs before saying
# "done", so what passes locally passes here. A red check blocks the merge.
name: CI

on:
  pull_request:
  push:
    branches: [testing, main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npm run verify

  # The database: starts a throwaway Supabase on GitHub's computer, which
  # applies every migration, then runs the security tests and proves every
  # change can be undone. Nothing here touches the hospital's database.
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - name: Start a throwaway Supabase database
        run: supabase db start
      - name: Run the security tests, then undo and redo every change
        run: scripts/db-test.sh "postgresql://postgres:postgres@127.0.0.1:54322/postgres" --tests-only

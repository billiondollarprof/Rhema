# ci.yml: the checks that run on every pull request and every push.
# It runs `npm run verify`, the same command an agent runs before saying
# "done", so what passes locally passes here. A red check blocks the merge.
name: CI

on:
  pull_request:
  push:
    branches: [testing, main]
  # Lets a feature branch be checked before anything reaches testing.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    # A stuck step fails after this many minutes, instead of 6 hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npm run verify
      # The AWS template is checked by AWS's own linter (request 74).
      - name: Check the AWS template
        run: pip install --quiet cfn-lint && cfn-lint aws/template.yaml

  # The database: starts a throwaway Supabase on GitHub's computer, which
  # applies every migration, then runs the security tests and proves every
  # change can be undone. Nothing here touches the hospital's database.
  database:
    runs-on: ubuntu-24.04
    # A stuck step fails after this many minutes, instead of 6 hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      # The install sometimes stalls before any test runs (request 120,
      # 2026-10-30 and 31): give it 3 minutes, then try once more.
      - name: Install the Supabase tool
        id: supabase_cli
        uses: supabase/setup-cli@v2
        timeout-minutes: 3
        continue-on-error: true
        with:
          version: 2.122.0
      - name: Install the Supabase tool (second try)
        if: steps.supabase_cli.outcome != 'success'
        uses: supabase/setup-cli@v2
        timeout-minutes: 3
        with:
          version: 2.122.0
      - name: Start a throwaway Supabase database
        run: supabase db start
      - name: Run the security tests, then undo and redo every change
        run: scripts/db-test.sh "postgresql://postgres:postgres@127.0.0.1:54322/postgres" --tests-only

  # Sign in, used for real: a throwaway Supabase sends real codes to a local
  # mailbox, and a browser signs two made up nurses in, sets PINs, locks,
  # switches person and signs out. Screenshots are kept for a person to see.
  signin:
    runs-on: ubuntu-24.04
    # A stuck step fails after this many minutes, instead of 6 hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      # The install sometimes stalls before any test runs (request 120,
      # 2026-10-30 and 31): give it 3 minutes, then try once more.
      - name: Install the Supabase tool
        id: supabase_cli
        uses: supabase/setup-cli@v2
        timeout-minutes: 3
        continue-on-error: true
        with:
          version: 2.122.0
      - name: Install the Supabase tool (second try)
        if: steps.supabase_cli.outcome != 'success'
        uses: supabase/setup-cli@v2
        timeout-minutes: 3
        with:
          version: 2.122.0
      - run: npm ci
      - name: Install the test browser
        run: npm install --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - name: Sign in, used for real
        run: scripts/e2e-signin.sh
      # The pictures are for finding out why the sign in test failed, so they
      # are kept only when it failed, for 3 days. On 2026-11-09 GitHub's
      # storage for them filled up and this step turned a passing run red;
      # keeping them is never a test, so a full store must not fail the run.
      - name: Keep the screenshots
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: sign-in-screens
          path: e2e-screens/
          retention-days: 3

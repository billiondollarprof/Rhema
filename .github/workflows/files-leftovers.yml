# =============================================================================
# files-leftovers.yml: find, and on request delete, uploaded files in R2 that
# no record points at any more.
#
# Why: Anthony, 2026-11-16 (request 205): the 8 test patients on live were
# deleted, and two files he had uploaded for one of them stayed in file
# storage with nothing pointing at them: "clear the uploaded files, it was me
# that uploaded it while I was working."
#
# How it decides: a file is a leftover only when its name is in neither
# patient_files.file_key nor lab_results.file_key on that site's database.
#   - mode "list" (the default) only prints the leftovers. It changes nothing.
#   - mode "delete" deletes them, and refuses if there are more than
#     "at_most", so a mistake can never empty the storage.
# File names are random (record/<uuid>.jpg), so the log shows nothing about
# any patient.
#
# Never: run "delete" without Anthony's yes for that run. Never delete a file
# a record still points at.
# =============================================================================
name: File leftovers

on:
  workflow_dispatch:
    inputs:
      site:
        description: 'testing or live'
        required: true
        default: testing
        type: choice
        options: [testing, live]
      mode:
        description: 'list (changes nothing) or delete'
        required: true
        default: list
        type: choice
        options: [list, delete]
      at_most:
        description: 'delete refuses if there are more leftovers than this'
        required: true
        default: '2'

permissions:
  contents: read

jobs:
  leftovers:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: ${{ inputs.site == 'live' && 'ntfvckqczpmylskusgft' || 'nfrvwvqmfxudaarfuwxg' }}
      DB_PASSWORD: ${{ inputs.site == 'live' && secrets.SUPABASE_DB_PASSWORD || secrets.SUPABASE_TESTING }}
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BUCKET: ${{ inputs.site == 'live' && 'rhema-files' || 'rhema-files-testing' }}
      MODE: ${{ inputs.mode }}
      AT_MOST: ${{ inputs.at_most }}
    steps:
      - name: Make sure psql is installed
        run: command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)

      # ===== 1. Every file name the database still points at =====
      - name: Read the file names the records use
        run: |
          pooler=$(curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$REF/config/database/pooler")
          export PGHOST=$(echo "$pooler" | jq -r '.[0].db_host')
          export PGUSER=$(echo "$pooler" | jq -r '.[0].db_user')
          export PGPASSWORD="$DB_PASSWORD" PGPORT=5432 PGDATABASE=postgres
          psql -v ON_ERROR_STOP=1 -At -c "
            select file_key from public.patient_files where file_key is not null
            union select file_key from public.lab_results where file_key is not null" \
            | sort -u > used.txt
          echo "Files the records point at: $(wc -l < used.txt)"

      # ===== 2. Every file in storage =====
      - name: List the files in storage
        run: |
          : > stored.txt
          cursor=""
          while :; do
            url="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/r2/buckets/$BUCKET/objects?per_page=1000"
            if [ -n "$cursor" ]; then url="$url&cursor=$cursor"; fi
            page=$(curl -fsS -H "Authorization: Bearer $CF_TOKEN" "$url")
            echo "$page" | jq -r '.result[].key' >> stored.txt
            cursor=$(echo "$page" | jq -r '.result_info.cursor // empty')
            truncated=$(echo "$page" | jq -r '.result_info.is_truncated // false')
            if [ "$truncated" != "true" ] || [ -z "$cursor" ]; then break; fi
          done
          sort -u stored.txt -o stored.txt
          echo "Files in $BUCKET: $(wc -l < stored.txt)"

      # ===== 3. The leftovers, then delete them if asked =====
      - name: Leftovers
        run: |
          comm -23 stored.txt used.txt > leftovers.txt
          count=$(wc -l < leftovers.txt)
          echo "Leftover files (no record points at them): $count"
          cat leftovers.txt
          if [ "$MODE" != "delete" ]; then
            echo "List only: nothing was deleted."
            exit 0
          fi
          if [ "$count" -gt "$AT_MOST" ]; then
            echo "::error::$count leftovers is more than at_most ($AT_MOST). Nothing was deleted."
            exit 1
          fi
          while read -r key; do
            [ -z "$key" ] && continue
            # The name holds a slash (record/...), so it is encoded for the address.
            encoded=$(printf '%s' "$key" | jq -sRr @uri)
            curl -fsS -X DELETE -H "Authorization: Bearer $CF_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/r2/buckets/$BUCKET/objects/$encoded" > /dev/null
            echo "Deleted $key"
          done < leftovers.txt
          echo "Deleted $count leftover files from $BUCKET."

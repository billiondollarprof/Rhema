# deploy.yml: puts the app live on Cloudflare, then checks it really works.
#
# testing branch -> the Worker "rhema-hospital-testing" (nobody outside sees it)
# main branch    -> the Worker "rhema-hospital" (the live hospital system)
#
# It needs two GitHub secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# It also reads each site's database address and public key from Supabase
# with SUPABASE_ACCESS_TOKEN (read only on API keys).
# Until they are added, this workflow says so and stops, without failing.
name: Deploy

on:
  push:
    branches: [testing, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    # A stuck step fails after this many minutes, instead of 6 hours.
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: ${{ github.ref_name == 'main' && 'rhema-hospital' || 'rhema-hospital-testing' }}
      # The testing site talks to the testing database, the live site to
      # the live one. Never the other way round.
      SUPABASE_REF: ${{ github.ref_name == 'main' && 'ntfvckqczpmylskusgft' || 'nfrvwvqmfxudaarfuwxg' }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Stop if the Cloudflare secrets are not set yet
        id: gate
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare secrets are not set yet, so nothing was deployed."
            echo "ready=no" >> "$GITHUB_OUTPUT"
          else
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.gate.outputs.ready == 'yes'
        uses: actions/checkout@v6
      - if: steps.gate.outputs.ready == 'yes'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - if: steps.gate.outputs.ready == 'yes'
        run: npm ci

      # The screens are plain files, so the database address and its public
      # (publishable) key are baked in at build time. The key is meant to be
      # public; the secret key is never fetched here.
      - name: Find this site's database address and public key
        if: steps.gate.outputs.ready == 'yes'
        run: |
          keys=$(curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_REF/api-keys?reveal=false")
          key=$(echo "$keys" | jq -r '[.[] | select(.type == "publishable")][0].api_key // empty')
          if [ -z "$key" ]; then
            key=$(echo "$keys" | jq -r '[.[] | select(.name == "anon")][0].api_key // empty')
          fi
          test -n "$key" || { echo "No publishable key found for $SUPABASE_REF"; exit 1; }
          echo "NEXT_PUBLIC_SUPABASE_URL=https://$SUPABASE_REF.supabase.co" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$key" >> "$GITHUB_ENV"

      - if: steps.gate.outputs.ready == 'yes'
        run: npm run build

      - name: Deploy to Cloudflare
        if: steps.gate.outputs.ready == 'yes'
        id: deploy
        # pipefail: without it, "| tee" hides a failed deploy behind tee's
        # own success, and the step goes green when nothing was deployed.
        # Found 2026-10-28, when a bad account ID still showed success.
        run: |
          set -o pipefail
          npx wrangler deploy --name "$WORKER_NAME" | tee deploy.log
          url=$(grep -o 'https://[a-z0-9.-]*workers\.dev' deploy.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # The smoke test: the deploy reporting success is not proof the site
      # works, so ask the address that was just deployed for the screen and
      # for the health check.
      - name: Smoke test the address that was just deployed
        if: steps.gate.outputs.ready == 'yes'
        run: |
          url="${{ steps.deploy.outputs.url }}"
          test -n "$url" || { echo "No workers.dev address found in the deploy output"; exit 1; }
          for i in 1 2 3 4 5 6; do
            if curl -fsS "$url/api/health" | grep -q '"ok":true' && curl -fsS -o /dev/null "$url/" && curl -fsS -o /dev/null "$url/sign-in/"; then
              echo "Smoke test passed: $url"; exit 0
            fi
            sleep 10
          done
          echo "Smoke test FAILED: $url"; exit 1
